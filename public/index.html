<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA Mission Control</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link rel="stylesheet" href="/app.css">
<script src="/chart.umd.min.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#818cf8"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <symbol id="i-dash"    viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></symbol>
    <symbol id="i-map"     viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></symbol>
    <symbol id="i-layers"  viewBox="0 0 24 24"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></symbol>
    <symbol id="i-list"    viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1.4"/><circle cx="4" cy="12" r="1.4"/><circle cx="4" cy="18" r="1.4"/></symbol>
    <symbol id="i-redo"    viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></symbol>
    <symbol id="i-book"    viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></symbol>
    <symbol id="i-gear"    viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.51 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></symbol>
    <symbol id="i-sync"    viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></symbol>
    <symbol id="i-flame"   viewBox="0 0 24 24"><path d="M12 22c4.4 0 7-2.8 7-6.5 0-3.2-2-5.3-3.5-7C14 6.7 13 5 13 2c-3 2-5.5 5-5.5 8 0 1.5.5 2.5.5 2.5S6 11.6 6 9.5C4.7 11 4 13.4 4 15c0 4 3.2 7 8 7Z"/></symbol>
    <symbol id="i-target"  viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></symbol>
    <symbol id="i-bolt"    viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></symbol>
    <symbol id="i-clock"   viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-check"   viewBox="0 0 24 24"><path d="m4 12.5 5 5L20 6.5"/></symbol>
    <symbol id="i-plus"    viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x"       viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-trash"   viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13"/></symbol>
    <symbol id="i-ext"     viewBox="0 0 24 24"><path d="M14 4h6v6M20 4 10.5 13.5"/><path d="M20 14v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></symbol>
    <symbol id="i-flag"    viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4c5-2.5 9 2.5 14 0v9c-5 2.5-9-2.5-14 0"/></symbol>
    <symbol id="i-trend"   viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8"/><path d="M21 12V7h-5"/></symbol>
    <symbol id="i-cal"     viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
    <symbol id="i-sys"     viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="6" rx="1.5"/><rect x="14" y="3" width="7" height="6" rx="1.5"/><rect x="8.5" y="15" width="7" height="6" rx="1.5"/><path d="M6.5 9v3h11V9M12 12v3"/></symbol>
    <symbol id="i-user"    viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></symbol>
  </defs>
</svg>

<div class="app">
  <aside class="side">
    <div class="logo">
      <div class="logo-mark"><svg><use href="#i-target"/></svg></div>
      <div class="logo-text">DSA<span>MISSION CONTROL</span></div>
    </div>

    <nav class="nav" id="nav">
      <a href="#dashboard" data-view="dashboard" class="nav-item"><svg><use href="#i-dash"/></svg>Dashboard</a>
      <a href="#topics"    data-view="topics"    class="nav-item"><svg><use href="#i-layers"/></svg>Topics</a>
      <a href="#log"       data-view="log"       class="nav-item"><svg><use href="#i-list"/></svg>Problem Log<span class="nav-badge" id="nav-log-count"></span></a>
      <a href="#redo"      data-view="redo"      class="nav-item"><svg><use href="#i-redo"/></svg>Redo Queue<span class="nav-badge warn" id="nav-redo-count"></span></a>
      <a href="#sysdesign" data-view="sysdesign" class="nav-item"><svg><use href="#i-sys"/></svg>System Design<span class="nav-badge sd" id="nav-sd-count"></span></a>
      <a href="#playbook"  data-view="playbook"  class="nav-item"><svg><use href="#i-book"/></svg>Playbook</a>
      <a href="#settings"  data-view="settings"  class="nav-item"><svg><use href="#i-gear"/></svg>Settings</a>
    </nav>

    <div class="side-foot">
      <div class="lc-user">
        <div class="lc-avatar"><svg><use href="#i-user"/></svg></div>
        <div class="lc-meta">
          <div class="lc-name" id="side-user">—</div>
          <div class="lc-rank" id="side-rank">rank —</div>
        </div>
        <div class="sync-dot" id="sync-dot" title="sync status"></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">Dashboard</h1>
        <div class="page-sub" id="page-sub">320 problems · auto-synced from LeetCode</div>
      </div>
      <div class="top-actions">
        <div class="last-sync" id="last-sync">—</div>
        <button class="btn btn-primary" id="btn-sync"><svg><use href="#i-sync"/></svg><span>Sync now</span></button>
      </div>
    </header>

    <div class="views">
      <section id="view-dashboard" class="view"></section>
      <section id="view-topics"    class="view"></section>
      <section id="view-log"       class="view"></section>
      <section id="view-redo"      class="view"></section>
      <section id="view-sysdesign" class="view"></section>
      <section id="view-playbook"  class="view"></section>
      <section id="view-settings"  class="view"></section>
    </div>
  </main>
</div>

<div class="modal-back" id="modal-back">
  <div class="modal" id="modal"></div>
</div>
<div class="toasts" id="toasts"></div>

<script src="/app.js"></script>
</body>
</html>
